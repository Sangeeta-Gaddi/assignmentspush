<html>

<head>
    <title> Css Selectors </title>

    <style>

        .c1>p{
            color: blue
        }

    </style>
</head>

<body>
    <div class="c1">
        <p>
            I'm the direct son
        </p>
    </div>

    <div class="c1">
        <span>
            <p>I'm the indirect son</p>
        </span>
    </div>


</body>

</html>
